version: 2

git:
  ignore_tags:
    - boot-images
    - dev

before:
  hooks:
    - make vet
    - make test
    - make manifest

builds:
  - id: host
    main: ./cmd/echolocal
    binary: echolocal
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/ygelfand/echolocal/internal/layout.Version={{.Version}} -X github.com/ygelfand/echolocal/internal/layout.GitCommit={{.Commit}} -X github.com/ygelfand/echolocal/internal/layout.BuildDate={{.Date}}

archives:
  - formats: ["binary"]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}

release:
  # Releases in this fork are named like 0.0.11-fork.1. They must count as normal releases,
  # or the stable update channel (GitHub's "latest") would never offer them.
  prerelease: false
  extra_files:
    # build-echod-all clears bin/echod-* first, so this is exactly what this build produced.
    - glob: ./bin/echod-*
    - glob: ./bin/manifest.json

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github-native
